<!DOCTYPE html>
<html>
<head>
  <title>Political Department Attendance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>POLITICAL DEPARTMENT ATTENDANCE</h1>

  <div class="top-bar">
    <input type="date" id="date">
    <button onclick="loadAttendance()">Load</button>
  </div>

  <div class="top-actions">
    <button class="green" onclick="markAllPresent()">Mark All Present</button>
    <button class="red" onclick="markAllAbsent()">Mark All Absent</button>
  </div>

  <div id="students"></div>

  <div class="actions">
    <button class="blue" onclick="saveAttendance()">Save</button>
    <button class="orange" onclick="updateAttendance()">Update</button>
  </div>

  <h2>Monthly Report</h2>
  <button class="purple" onclick="generateReport()">Generate & Download Excel</button>

</div>

<script src="app.js"></script>
</body>
</html>
