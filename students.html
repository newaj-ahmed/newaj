
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students Information</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- MAINTENANCE SECTION -->

    <section class="maintenance-page">

        <div class="maintenance-box">

            <h1>PAGE UNDER MAINTENANCE</h1>

            <p>
                Student information section is currently unavailable.
                Please try again later.
            </p>

            <h2>Opening On</h2>

            <h3>01 July 2026 • 09:00 AM</h3>

            <!-- COUNTDOWN -->

            <div class="countdown">

                <div class="time-box">
                    <span id="days">00</span>
                    <small>Days</small>
                </div>

                <div class="time-box">
                    <span id="hours">00</span>
                    <small>Hours</small>
                </div>

                <div class="time-box">
                    <span id="minutes">00</span>
                    <small>Minutes</small>
                </div>

                <div class="time-box">
                    <span id="seconds">00</span>
                    <small>Seconds</small>
                </div>

            </div>

            <p class="contact-text">
                Contact: @newaj_ahmad
            </p>

            <a href="index.html" class="back-btn">
                GO BACK
            </a>

        </div>

    </section>

    <!-- FLOATING SOCIAL BUTTONS -->

    <div class="social-buttons">

        <a href="https://wa.me/919387127176" target="_blank">

            <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">

        </a>

        <a href="https://instagram.com/newaj_ahmad" target="_blank">

            <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">

        </a>

    </div>

    <!-- COUNTDOWN SCRIPT -->

    <script>

        const targetDate = new Date("July 1, 2026 09:00:00").getTime();

        const countdown = setInterval(function(){

            const now = new Date().getTime();

            const distance = targetDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));

            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = days;

            document.getElementById("hours").innerHTML = hours;

            document.getElementById("minutes").innerHTML = minutes;

            document.getElementById("seconds").innerHTML = seconds;

            if(distance < 0){

                clearInterval(countdown);

                document.querySelector(".countdown").innerHTML = "NOW OPEN";

            }

        },1000);

    </script>

</body>

</html>
