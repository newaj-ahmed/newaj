<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents Hub | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #5C1D2B; --secondary: #F8F5F2; --accent: #D4AF37; --text-dark: #222222; --text-muted: #555555; --font-heading: 'Cinzel', serif; --font-body: 'Poppins', sans-serif; }
        body { font-family: var(--font-body); color: var(--text-dark); margin:0; padding-top: 100px; }
        header { position: fixed; top: 0; left: 0; width: 100%; padding: 15px 8%; display: flex; justify-content: space-between; align-items: center; background: #fff; box-shadow: 0 2px 20px rgba(0,0,0,0.05); z-index:1000; height: 90px; }
        .logo-text { font-family: var(--font-heading); font-weight:700; color:var(--primary); }
        .nav-menu { display: flex; list-style: none; gap: 20px; }
        .nav-link { text-decoration: none; color: var(--text-dark); font-size: 0.85rem; }
        .nav-link.active { color: var(--primary); border-bottom: 2px solid var(--accent); }
        
        /* HAMBURGER TRIGGER BUTTON STYLE */
        .hamburger { display: none; cursor: pointer; background: none; border: none; font-size: 1.4rem; color: var(--primary); padding: 5px; z-index: 1002; }

        .whatsapp-widget { position: fixed; bottom: 30px; right: 30px; background-color: #25D366; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; z-index:9999; text-decoration:none;}

        .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
        h1 { font-family: var(--font-heading); color: var(--primary); text-align: center; margin-bottom: 40px; }
        
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; }
        .card { background: var(--secondary); padding: 30px 20px; border-radius: 8px; text-align: center; border: 1px solid rgba(0,0,0,0.05); }
        .card h3 { font-size: 1.1rem; color: var(--primary); margin-bottom: 15px; }
        .btn { display: inline-block; padding: 8px 20px; background: var(--primary); color:#fff; text-decoration:none; font-size:0.85rem; border-radius:4px; transition:0.3s; }
        .btn:hover { background: transparent; color: var(--primary); border: 1px solid var(--primary); }

        @media(max-width: 768px) { 
            .grid { grid-template-columns: 1fr; } 
            
            /* SHOW THE THREE LINES IN MOBILE VIEW */
            .hamburger { display: block !important; }
            nav { display: flex; align-items: center; }
            
            .nav-menu { 
                position: fixed; 
                top: 90px; 
                right: -100%; 
                width: 260px; 
                height: calc(100vh - 90px); 
                background: #ffffff; 
                flex-direction: column; 
                padding: 30px; 
                gap: 15px; 
                box-shadow: -5px 5px 15px rgba(0,0,0,0.05); 
                transition: right 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); 
                display: flex !important; /* Force menu state override over desktop rules */
                z-index: 1001;
            }
            .nav-menu.open { right: 0; }
        }
        footer { background: var(--primary); color: #fff; text-align: center; padding: 30px 0; margin-top: 60px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <header>
        <div class="logo-text">NEWAJ AHMED</div>
        <nav>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="about.html" class="nav-link">About Me</a></li>
                <li><a href="academy.html" class="nav-link">Academy Profile</a></li>
                <li><a href="activities.html" class="nav-link">Activities</a></li>
                <li><a href="gallery.html" class="nav-link">Gallery</a></li>
                <li><a href="diary.html" class="nav-link">Daily Diary</a></li>
                <li><a href="documents.html" class="nav-link active">Documents</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
            </ul>
        </nav>
        <button class="hamburger" id="hamburgerBtn" aria-label="Toggle navigation Menu">
            <i class="fas fa-bars"></i>
        </button>
    </header>

    <a href="https://wa.me/919387127176" class="whatsapp-widget" target="_blank"><i class="fab fa-whatsapp"></i></a>

    <div class="container">
        <h1>Deliverables Registry</h1>
        <div class="grid">
            <div class="card"><h3>Official Internship Report</h3><a href="#" class="btn">View Document</a></div>
            <div class="card"><h3>Verified Daily Log Diary</h3><a href="#" class="btn">Download PDF</a></div>
            <div class="card"><h3>Completion Certificate</h3><a href="#" class="btn">View Certificate</a></div>
        </div>
    </div>
    <footer><p>© 2026 Academic Records</p></footer>

    <script>
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const navMenu = document.getElementById('navMenu');
        
        hamburgerBtn.addEventListener('click', (e) => { 
            e.stopPropagation();
            navMenu.classList.toggle('open'); 
        });

        document.addEventListener('click', (e) => {
            if (!navMenu.contains(e.target) && !hamburgerBtn.contains(e.target)) {
                navMenu.classList.remove('open');
            }
        });
    </script>
</body>
</html>
